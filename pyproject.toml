########## Project ##########
[project]
name = "plotnine-extra"
description = "Extension package for plotnine with extra geoms, stats, composition, and animation"
license = {text = "MIT"}
authors = [
  {name = "Hassan Kibirige", email = "has2k1@gmail.com"},
]
version = "0.3.1"
readme = "README.md"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Visualization"
]
dependencies = [
    # plotnine 0.16 has no stable release yet -- PyPI's latest stable is
    # 0.15.8, and 0.16 exists only as alphas. A plain `plotnine>=0.16` is
    # therefore UNSATISFIABLE ("No solution found"); PEP 440 only permits
    # pre-releases when the specifier itself names one, which is what
    # `>=0.16.0a14` does. That makes `pip install plotnine-extra` work with no
    # `--pre` flag. Raise this floor as soon as 0.16.0 ships stable.
    "plotnine>=0.16.0a14",
    "scipy>=1.15.0",
    # Imported directly across the package (numpy in 48 modules, pandas in 53,
    # matplotlib in 16), so they are declared rather than left to arrive
    # transitively via plotnine. The floors match plotnine 0.16's own, so
    # this records the real dependency surface without narrowing what pip can
    # resolve. matplotlib in particular is load-bearing: the image baselines
    # are pixel-exact, so a matplotlib minor bump re-diffs all of them. The
    # `test` extra therefore caps matplotlib -- see the note there.
    "matplotlib>=3.10.0",
    "numpy>=1.25.0",
    "pandas>=2.2.0",
]
requires-python = ">=3.11"

[project.scripts]
plotnine-extra-install-skills = "plotnine_extra._skills.install:main"

[project.optional-dependencies]
all = [
    "plotnine-extra[lint]",
    "plotnine-extra[test]",
    "plotnine-extra[build]",
    "plotnine-extra[dev]",
]

lint = [
    "ruff",
]

test = [
    # pytest itself was missing: `pip install -e ".[test]"` installed no test
    # runner, and CI only worked because the GitHub runner image ships one.
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.0.0",
    # The image baselines are pixel-exact, so a matplotlib minor bump silently
    # re-diffs all 44 of them. Cap the range to keep renders reproducible;
    # widen deliberately, alongside a baseline regeneration, when upgrading.
    "matplotlib>=3.10.0,<3.12",
]

build = [
    "build",
    "wheel",
]

dev = [
    "twine",
    "pre-commit",
]

doc = [
    "sphinx>=7.0",
    "furo",
    "nbsphinx>=0.9",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/mdmanurung/plotnine-extra"
Documentation = "https://mdmanurung.github.io/plotnine-extra"
Repository = "https://github.com/mdmanurung/plotnine-extra.git"
"Bug Tracker" = "https://github.com/mdmanurung/plotnine-extra/issues"

########## Build System ##########
[build-system]
# Pin setuptools below 75 to avoid PEP 639 license-expression metadata
# that is not yet supported by all tooling (e.g. twine check).
requires = [
    "setuptools>=59,<75",
    "wheel",
]
build-backend = "setuptools.build_meta"

########## Tool - Setuptools ##########
[tool.setuptools.packages.find]
include = ["plotnine_extra*"]

[tool.setuptools.package-data]
"plotnine_extra.data" = ["*.csv"]
"plotnine_extra._skills" = [
    "data/SKILL.md",
    "data/references/*.md",
]

########## Tool - Pytest ##########
[tool.pytest.ini_options]
testpaths = [
    "tests"
]
doctest_optionflags = "ALLOW_BYTES NORMALIZE_WHITESPACE"
addopts = "--import-mode=importlib"

########## Tool - Coverage ##########
# Coverage.py
[tool.coverage.run]
branch = true
source = ["plotnine_extra"]
include = [
    "plotnine_extra/*"
]
omit = [
    "tests/*",
]

disable_warnings = ["include-ignored"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "^def test_",
    "if __name__ == .__main__.:",
    "raise NotImplementedError('Not Implemented')",
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "except ImportError:",
    "except PackageNotFoundError:",
]
precision = 1


########## Tool - Pyright ##########
[tool.pyright]
include = [
    "plotnine_extra/"
]
ignore = []
defineConstant = { DEBUG = true }
useLibraryCodeForTypes = true
reportUnnecessaryTypeIgnoreComment = true
executionEnvironments = []
stubPath = ""

########## Tool - Ruff ##########
[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
   "E",
   "F",
   "I",
   "TCH",
   "Q",
   "PIE",
   "PTH",
   "PD",
   "PYI",
   "RSE",
   "SIM",
   "B904",
   "FLY",
   "NPY",
   "PERF102"
]
ignore = [
    "E741",  # Ambiguous l
    "E743",  # Ambiguous I
    # .reset_index, .rename, .replace
    "PD002",
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    "**/__pycache__",
    "node_modules"
]


# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"plotnine_extra/__init__.py" = ["F403", "F405", "F401", "E402"]
