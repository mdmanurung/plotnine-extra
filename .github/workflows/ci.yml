name: CI

on:
  push:
    # Run on every branch, not just main. Previously this watched `main` and
    # pull requests only, so work pushed to a feature branch that was not yet
    # a PR received no CI at all.
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff
      - name: Lint
        run: ruff check plotnine_extra tests
      - name: Check formatting
        run: ruff format --check plotnine_extra tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor: plotnine 0.16 requires Python >= 3.11.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[test]"
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_benchmarks.py \
            --cov=plotnine_extra \
            --cov-report=term-missing \
            --cov-fail-under=50

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[test]"
      - name: Record timings for the plotting hot paths
        run: |
          python -m pytest tests/test_benchmarks.py -v \
            --benchmark-only \
            --benchmark-columns=min,mean,ops \
            --benchmark-sort=name \
            --benchmark-json-output=bench.json
      - name: Show timings
        run: python -c "import json; d=json.load(open('bench.json')); \
          [print(f'{b[\"name\"]:<50} {b[\"stats\"][\"min\"]*1000:9.3f} ms') \
           for b in d['benchmarks']]"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-timings
          path: bench.json

  prerelease:
    # We depend on a plotnine alpha (there is no stable 0.16 yet), so keep an
    # early-warning lane on the newest pre-release. It is non-blocking: the
    # stable lane above is what gates a merge.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package, then bump plotnine to the newest alpha
        run: |
          pip install -e ".[test]"
          pip install --pre --upgrade "plotnine>=0.16.0a15"
      - name: Show resolved plotnine
        run: python -c "import plotnine; print('plotnine', plotnine.__version__)"
      - name: Run tests
        run: |
          python -m pytest tests/ -v --ignore=tests/test_benchmarks.py

  downstream:
    # ggann and annplyr build on this package. Run their own suites against
    # this checkout so a change here cannot break them unnoticed. Blocking.
    # Their tests are not in the wheels, so clone the repos into vendor/.
    runs-on: ubuntu-latest
    env:
      ANNPLYR_REF: bb80d1285d41a1e0470311bb887018433c5acc80
      GGANN_REF: fix/plotnine-0.16-compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mdmanurung/annplyr
          ref: ${{ env.ANNPLYR_REF }}
          path: vendor/annplyr
      - uses: actions/checkout@v4
        with:
          repository: mdmanurung/ggann
          ref: ${{ env.GGANN_REF }}
          path: vendor/ggann
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install this checkout with both downstream packages
        run: |
          pip install -e . -e vendor/annplyr -e "vendor/ggann[test]"
      - name: Show resolved versions
        run: |
          python -c "import plotnine, plotnine_extra, annplyr, ggann; print('plotnine', plotnine.__version__)"
      - name: annplyr tests
        working-directory: vendor/annplyr
        run: python -m pytest -q
      - name: ggann tests
        working-directory: vendor/ggann
        run: python -m pytest -q

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install dependencies
        run: pip install -e ".[doc]"

      - name: Execute all vignette notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=600 \
            docs/vignettes/*.ipynb
